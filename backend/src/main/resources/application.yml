server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: extreme-weather-response-system

  datasource:
    url: ${DB_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:extreme_weather_db}}}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:postgres_dev_secret_2026}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true
        spatial:
          connection_handling: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: false
    locations: classpath:db/migration

# Security JWT configuration
app:
  security:
    jwt:
      secret: ${JWT_SECRET:${APP_JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}}
      expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
      issuer: extreme-weather-response-system

  # External Weather Integration
  weather:
    provider: ${WEATHER_PROVIDER:open-meteo} # open-meteo or mock
    base-url: ${WEATHER_API_BASE_URL:https://api.open-meteo.com/v1}
    api-key: ${WEATHER_API_KEY:}
    polling-cron: "0 */30 * * * *" # Every 30 minutes
    timeout-ms: 5000
    mock-fallback: true

  # Notification Integration (FCM and SMS)
  notification:
    fcm:
      enabled: ${FCM_ENABLED:false}
      credentials-path: ${FCM_CREDENTIALS_PATH:}
      mock-mode: ${FCM_MOCK_MODE:true}
    sms:
      enabled: ${SMS_ENABLED:false}
      provider: ${SMS_PROVIDER:mock}
      api-key: ${SMS_API_KEY:}
      mock-mode: ${SMS_MOCK_MODE:true}

  # Configurable Risk Scoring Engine Defaults
  risk:
    scoring:
      high-risk-threshold: 75.0
      medium-risk-threshold: 45.0
      auto-reassess-on-alert: true

# Swagger / OpenAPI documentation
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

logging:
  file:
    name: server_app.log
  level:
    root: INFO
    com.extremeweather: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
