services:
  # VULNEX Backend - Java 21 Spring Boot Web Service
  - type: web
    name: vulnex-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        fromDatabase:
          name: vulnex-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: vulnex-postgres
          property: port
      - key: DB_NAME
        fromDatabase:
          name: vulnex-postgres
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: vulnex-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: vulnex-postgres
          property: password
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: vulnex-postgres
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: vulnex-postgres
          property: password
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: validate
      - key: SPRING_FLYWAY_ENABLED
        value: "true"
      - key: SPRING_FLYWAY_BASELINE_ON_MIGRATE
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: APP_JWT_SECRET
        generateValue: true
      - key: APP_JWT_EXPIRATION_MS
        value: "86400000"
      - key: CORS_ALLOWED_ORIGINS
        value: "*"

  # VULNEX Authority Dashboard - Vite React SPA
  - type: web
    name: vulnex-authority-dashboard
    runtime: static
    buildCommand: cd authority-dashboard && npm install && npm run build
    staticPublishPath: ./authority-dashboard/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: vulnex-backend
          property: host
